services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knight_hacks
      POSTGRES_USER: knight_hacks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knight_hacks_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knight_hacks -d knight_hacks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
