name: App tests and Vultr deployment

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - 'models/**'
      - 'deploy/**'
      - 'SPOT_KnightHacks_Challenge_Kit Part One/02_DATA/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - 'models/**'
      - 'deploy/**'
      - 'SPOT_KnightHacks_Challenge_Kit Part One/02_DATA/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build frontend for the shared HTTPS origin
        env:
          VITE_API_BASE_URL: /api
        run: npm --prefix frontend run build

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: knight_hacks
          POSTGRES_USER: knight_hacks
          POSTGRES_PASSWORD: ci_database_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knight_hacks -d knight_hacks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://knight_hacks:ci_database_password@127.0.0.1:5432/knight_hacks
      DJANGO_SETTINGS_MODULE: config.production
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-only-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'server/requirements*.txt'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0
          python -m pip install -r server/requirements-production.txt
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r server/requirements-inference.txt
      - name: Check production configuration, API, and model runtime
        run: |
          bash -n deploy/*.sh
          python server/manage.py collectstatic --noinput
          python server/manage.py check
          python server/manage.py test api
          python server/manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
          python models/verify_publish.py

  deploy:
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: vultr-production-backend
      cancel-in-progress: false
    env:
      VULTR_HOST: ${{ secrets.VULTR_HOST }}
      VULTR_USER: ${{ secrets.VULTR_USER }}
      VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
      VULTR_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Deploy the tested main commit
        shell: bash
        run: |
          set -euo pipefail
          : "${VULTR_HOST:?Missing VULTR_HOST secret}"
          : "${VULTR_USER:?Missing VULTR_USER secret}"
          : "${VULTR_SSH_KEY:?Missing VULTR_SSH_KEY secret}"
          : "${VULTR_KNOWN_HOSTS:?Missing VULTR_KNOWN_HOSTS secret}"
          key_file="$RUNNER_TEMP/vultr_deploy_key"
          hosts_file="$RUNNER_TEMP/vultr_known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$VULTR_SSH_KEY" > "$key_file"
          printf '%s\n' "$VULTR_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VULTR_USER@$VULTR_HOST" "deploy $DEPLOY_SHA"
      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 3 "https://$VULTR_HOST/api/health"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://$VULTR_HOST/api/metrics" > /dev/null
      - name: Verify public frontend and bundled assets
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://$VULTR_HOST/" > /tmp/frontend.html
          grep -q 'id="root"' /tmp/frontend.html
          asset=$(sed -n 's/.*src="\([^"]*\/assets\/[^" ]*\.js\)".*/\1/p' /tmp/frontend.html | head -1)
          test -n "$asset"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://$VULTR_HOST$asset" > /dev/null
